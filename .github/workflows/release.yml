# Release do framework, toda em reutilizáveis do Aedis Platform: dispare manualmente para cortar a próxima versão
# (release-cut: semver derivado dos Conventional Commits desde a última tag; a tag vX.Y.Z sai com o token da GitHub
# App e dispara este mesmo workflow em push de tag), ou empurre uma tag vX.Y.Z. Empacotamento, assinatura (cosign
# keyless), SBOM SPDX, proveniência (SLSA Build L3, atestada pelo release-nuget) e publicação ficam no reutilizável.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento (auto = pelos commits desde a última tag)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  cut:
    name: Próxima versão pelos commits
    if: github.event_name == 'workflow_dispatch'
    uses: aedis-build/aedis-platform/.github/workflows/release-cut.yml@255a90d04956caf7436320b50f104aaf80502e64 # v1.2.4
    permissions:
      contents: read
    with:
      bump: ${{ inputs.bump }}
    secrets:
      app-id: ${{ secrets.AEDIS_CODER_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_CODER_APP_PRIVATE_KEY }}

  publish:
    name: Empacotar, assinar, atestar e publicar (SLSA Build L3)
    if: github.event_name == 'push'
    uses: aedis-build/aedis-platform/.github/workflows/release-nuget.yml@255a90d04956caf7436320b50f104aaf80502e64 # v1.2.4
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ github.ref_name }}
      solution: Aedis.slnx
      artifact-name: aedis
      # nuget.org por Trusted Publishing (OIDC, sem chave): a política da organização Aedis no nuget.org aceita este
      # release.yml. Mudar para true na release em que o Aedis estrear no NuGet público.
      publish-nuget: false
      nuget-user: ${{ vars.NUGET_USER }}
