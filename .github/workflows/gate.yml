# Portão de merge: a cada run do aedis-ci concluída numa PR, e a cada aprovação humana (review-signal), avalia
# .github/aedis-merge-policy.yaml e, se
# tudo passa, aprova como a GitHub App "Aedis Compliance" e habilita o auto-merge. Roda a partir da main
# (workflow_run) e nunca faz checkout do código da PR.
name: gate

on:
  workflow_run:
    workflows: [aedis-ci, review-signal]
    types: [completed]

permissions: {}

jobs:
  gate:
    if: contains(fromJSON('["pull_request", "pull_request_review"]'), github.event.workflow_run.event)
    uses: aedis-build/aedis-platform/.github/workflows/merge-gate.yml@87835c71df53fae48e13a535f6b04de95bca5955 # v1.2.2
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
      platform-ref: 820bfc78a548c3fcc98a5b9e303c93fa3a368243
    secrets:
      app-id: ${{ secrets.AEDIS_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_APP_PRIVATE_KEY }}
